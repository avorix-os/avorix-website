server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version
    server_tokens off;

    # Use relative redirects (avoids HTTP downgrade when behind Traefik TLS termination)
    absolute_redirect off;

    # Common security headers snippet (must be repeated in each location due to Nginx inheritance rules)
    # When add_header is used inside a location block, it overrides all server-level add_header directives.

    # 301 redirect: /produkt → /system
    location = /produkt {
        return 301 /system;
    }
    location = /produkt/ {
        return 301 /system;
    }

    # 301 redirect: /en/product → /en/cook-app (Anweisung 17, Abschnitt 1)
    # Die Seite war der aeltere von zwei englischen Produktstaenden und hat
    # kein deutsches Gegenstueck mehr. /en/cook-app traegt den vollen Inhalt.
    location = /en/product {
        return 301 /en/cook-app;
    }
    location = /en/product/ {
        return 301 /en/cook-app;
    }

    # ------------------------------------------------------------------
    # Anweisung 36 (Domain-Livegang): alte avorix.de-Pfade -> neue Ziele.
    # Regex mit optionalem Schluss-Slash deckt /pfad und /pfad/ ab.
    # Greift erst, wenn avorix.de auf dieses Hosting zeigt.
    # ------------------------------------------------------------------
    location ~ ^/leistungen/?$              { return 301 /system/; }
    location ~ ^/ueber-avorix/?$            { return 301 /ueber-uns/; }
    location ~ ^/termin-vereinbaren/?$      { return 301 /kontakt/; }
    location ~ ^/kuechenpersonal-finden/?$  { return 301 /personal/; }
    location ~ ^/servicepersonal-finden/?$  { return 301 /personal/; }
    location ~ ^/fb-beratung/?$             { return 301 /system/; }
    location ~ ^/startseite/?$              { return 301 /; }
    location ~ ^/gastronomie-personal-bodensee/?$       { return 301 /personal/bodensee/; }
    location ~ ^/gastronomie-personal-muenchen/?$       { return 301 /personal/muenchen/; }
    location ~ ^/gastronomie-personal-frankfurt-main/?$ { return 301 /personal/frankfurt/; }
    location ~ ^/cookie-richtlinie-eu/?$    { return 301 /datenschutz/; }
    location = /wp-content/uploads/2025/01/Avorix-AGB-2025.pdf { return 301 /agb-2025.pdf; }

    # Gehashte Build-Assets (Anweisung 30, Schritt 7.7).
    # Alles unter /_astro/ traegt einen Inhalts-Hash im Dateinamen und kann
    # dauerhaft gecacht werden. Vorher fielen die Bilder durch: die Regex-Regel
    # unten kennt kein `webp`, und Astro liefert genau das aus -- sie landeten
    # deshalb in `location /` mit `no-cache, must-revalidate`.
    # `^~` hat Vorrang vor den Regex-Regeln. Kein `expires`, sonst setzt nginx
    # einen zweiten Cache-Control-Kopf daneben.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # SPA-style fallback for clean URLs.
    # Anweisung 36: unbekannte Pfade fallen nicht auf 404, sondern auf den
    # @wp_fallback (301 auf /) -- faengt alte WordPress-Nebenpfade
    # (/feed/, /tag/, Autorenarchive, ?p=-Kurzlinks) mit Linkwert ab.
    location / {
        try_files $uri $uri/ $uri.html @wp_fallback;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://formspree.io https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Catch-all (Anweisung 36): alte avorix.de-URL ohne Entsprechung -> 301 auf /.
    # 301 statt 404, damit eingehende Links ihren Wert behalten.
    location @wp_fallback {
        return 301 /;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        try_files $uri @wp_fallback;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
