# nginx-Einbindung fuer den Avorix-Formular-Dienst (Anweisung 45, 3.1).
#
# 1) Diese Zeile in den http { } - Block (z. B. nginx.conf), EINMAL global:
#
#    limit_req_zone $binary_remote_addr zone=formular:10m rate=5r/m;
#
# 2) Diesen location-Block in den server { } - Block von avorix.de:

location = /api/formular {
    limit_req zone=formular burst=3 nodelay;
    client_max_body_size 12m;          # 10 MB Anhaenge + Overhead
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Die Absender-IP wird BEWUSST nicht an den Dienst durchgereicht (3.1 /
    # 3.2 Punkt 15). Die Ratenbegrenzung oben erledigt nginx anhand der IP.
}

# Optional: Health-Check (nur intern sinnvoll)
# location = /api/formular/health { proxy_pass http://127.0.0.1:8081; }
